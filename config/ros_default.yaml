# PLEASE NOTE THIS FILE IS NOT USED AUTOMATICALLY BY THE ODOMETRY'S LAUNCH FILE
# it's meant to just tell you what are the defaults for all the parameters
# to use this config with the launch file, you will still have to pass it with
# `config_file:=<full_or_relative_path_to>/ros_default.yaml`
# #############################################################################
# base_frame: base
# imu_topic: /imu
# lidar_topic: /lidar
odom_topic: /rko_lio/odom
odom_frame: odom
invert_odom_tf: false
publish_odom: true  # also the reset count
publish_odom_tf: true
publish_metrics: false  # rko_lio/metrics, field order in BaseNode::publish_metrics
# reset_on_registration_error: false
publish_local_map: true
map_topic: /rko_lio/local_map
publish_deskewed_scan: true

# lio config
deskew: true
deskew_per_stamp: false  # one deskew transform per distinct point stamp
voxel_size: 1.0
max_range: 100.0
min_range: 1.0
max_correspondence_distance: 0.5
convergence_criterion: 0.00001
max_num_threads: 1
initialization_phase: false
double_downsample: true
flat: false
# per-point time: one uint32, float32 or float64 field
lidar_time.field: t             # "" for none, which needs deskew: false
lidar_time.unit: ns             # ns, us or s
lidar_time.reference: relative  # relative to the header stamp, or absolute
