# PLEASE NOTE THIS FILE IS NOT USED AUTOMATICALLY BY THE ODOMETRY'S LAUNCH FILE
# it's meant to just tell you what are the defaults for all the parameters
# to use this config with the launch file, you will still have to pass it with
# `config_file:=<full_or_relative_path_to>/ros_default.yaml`
# #############################################################################
# base_frame: base
# imu_topic: /imu
# lidar_topic: /lidar
odom_topic: /rko_lio/odom
odom_frame: odom
invert_odom_tf: false
publish_odom: true  # false: no odometry or reset count is published
publish_odom_tf: true  # false: the odometry's tf is not broadcast
# each payload's statistics on rko_lio/metrics: Float64MultiArray, field order in ThreadedNode::publish_metrics
publish_metrics: false
# reset_on_registration_error: false
publish_local_map: true
map_topic: /rko_lio/local_map
publish_deskewed_scan: true
odom_at_imu_rate: false
# IMU-rate seq pipeline (used when launched with odom_at_imu_rate:=true and mode:=online):
# seq.odom_at_imu_rate_topic: rko_lio/odom_at_imu_rate
# seq.tf_at_imu_rate: false

# lio config
deskew: true
deskew_per_stamp: false  # for lidars whose points share exact stamps, for example one per column
voxel_size: 1.0
max_range: 100.0
min_range: 1.0
max_correspondence_distance: 0.5
convergence_criterion: 0.00001
max_num_threads: 1
initialization_phase: false
double_downsample: true
flat: false
# Lidar per-point timestamp processing - set when the heuristic fails.
# lidar_timestamps.multiplier_to_seconds: 0.0   # 0.0 = autodetect; e.g. 1e-6 for microseconds
# lidar_timestamps.force_absolute: false
# lidar_timestamps.force_relative: false
